  <title id="figure-title">Neoantimon2-Converters — four steps</title>
  <desc id="figure-description">Export from a completed Neoantimon2 project; user separately runs BA binding affinity, EL eluted ligand/presentation or IM immunogenicity prediction; reviewed converters adapt native output formats into standard TSV; strict import into the retained project preserves all origins and native results. No predictor execution or model accuracy was validated by synthetic converter/import tests.</desc>
